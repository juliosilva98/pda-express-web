# Publica o sistema no GitHub Pages a cada alteração enviada para a main.
# Valores em Settings > Secrets and variables > Actions > aba Secrets:
#   VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY (chave pública; nunca a service_role)
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Conferir variáveis
        run: |
          [ -n "$VITE_SUPABASE_URL" ] && echo "VITE_SUPABASE_URL encontrada" || echo "::error::VITE_SUPABASE_URL não encontrada em Secrets"
          [ -n "$VITE_SUPABASE_ANON_KEY" ] && echo "VITE_SUPABASE_ANON_KEY encontrada" || echo "::error::VITE_SUPABASE_ANON_KEY não encontrada em Secrets"
          [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ]
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
